<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YubiKey Fill settings</title>
<link rel="stylesheet" href="options.css">
<main>
  <h1><img src="icons/key-48.png" alt="" width="38" height="38"> YubiKey Fill</h1>
  <p>Pair an HTTPS login origin with an existing YubiKey authenticator account. Allow access to that site to show the autofill prompt beside its code field.</p>
  <form id="pair">
    <label for="site">HTTPS login origin</label>
    <input id="site" type="url" placeholder="https://login.example.com" required>
    <button id="read" type="button">Read YubiKey accounts</button>
    <label for="account">YubiKey account</label>
    <select id="account" required disabled></select>
    <label class="toggle"><input id="inline" type="checkbox" checked> Offer to fill on this site</label>
    <button id="save" disabled>Approve site</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <h2>Approved sites</h2>
  <ul id="sites"></ul>
</main>
<script type="module" src="options.js"></script>
</html>
